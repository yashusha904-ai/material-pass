services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: material-pass-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-material_pass}
      DB_USERNAME: ${DB_USERNAME:-material_pass}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - material-pass

  nginx:
    image: nginx:1.27-alpine
    container_name: material-pass-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - material-pass

  postgres:
    image: postgres:16-alpine
    container_name: material-pass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-material_pass}
      POSTGRES_USER: ${DB_USERNAME:-material_pass}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-material_pass} -d ${DB_DATABASE:-material_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - material-pass

  redis:
    image: redis:7-alpine
    container_name: material-pass-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - material-pass

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: material-pass-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-material_pass}
      DB_USERNAME: ${DB_USERNAME:-material_pass}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - material-pass

  vite:
    image: node:22-alpine
    container_name: material-pass-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
    environment:
      VITE_APP_NAME: ${APP_NAME:-Material Pass}
    depends_on:
      - app
    networks:
      - material-pass

networks:
  material-pass:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
